<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks | קריפטו</title><link rel="stylesheet" href="ui.css?v=20260825b"><style>.app{padding-bottom:50px}.back{border:0;background:#17263a;color:#19d3a7;width:40px;height:40px;border-radius:13px;font-size:20px}.portfolio-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#0d1929;border:1px solid #20314a;border-radius:18px;padding:14px}.metric span{font-size:10px;color:#91a0b6}.metric b{display:block;font-size:18px;margin-top:5px}.price-status{margin-top:10px;padding:11px 13px;border-radius:14px;background:#101e30;border:1px solid #20314a;color:#91a0b6;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}.price-status.stale{background:#f59e0b12;border-color:#f59e0b35;color:#f5c66b}.price-status button{border:1px solid #20314a;background:#0d1929;color:#19d3a7;border-radius:10px;padding:7px 11px;font-weight:800;font-size:11px;white-space:nowrap}.holding-card{margin-top:10px}.holding-top{display:flex;gap:10px;align-items:flex-start}.holding-top .ico{width:40px;height:40px;border-radius:12px;background:#101e30;display:grid;place-items:center;font-size:18px;font-weight:900;color:#19d3a7}.holding-top .grow{flex:1}.holding-top small{display:block;color:#91a0b6;margin-top:4px}.holding-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.holding-stat{background:#091522;border-radius:12px;padding:9px;text-align:center}.holding-stat span{font-size:9px;color:#91a0b6}.holding-stat b{display:block;font-size:13px;margin-top:3px}.holding-actions{display:flex;gap:7px;margin-top:11px}.holding-actions button{flex:1;border:1px solid #20314a;background:#101e30;color:#c3cede;border-radius:11px;padding:9px;font-weight:800}.holding-actions .del{color:#ff6b7a}.form-card{display:none}.form-card.show{display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-top:12px}.field label{display:block;color:#91a0b6;font-size:10px;margin:0 3px 6px}.field input,.field select{width:100%;border:1px solid #20314a;background:#091522;color:#fff;border-radius:13px;padding:12px;outline:0}.field small{display:block;color:#718096;font-size:9px;line-height:1.45;margin-top:5px}.primary2{width:100%;border:0;border-radius:14px;padding:13px;margin-top:14px;font-weight:900;color:#07111f;background:#19d3a7}.secondary2{width:100%;border:1px solid #20314a;border-radius:14px;padding:12px;margin-top:8px;font-weight:800;color:#c3cede;background:#101e30}@media(max-width:380px){.form-grid{grid-template-columns:1fr}.portfolio-summary{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="topbar"><div><h1>קריפטו</h1><div class="eyebrow">אחזקות ושווי עדכני בשקלים</div></div><button class="back" onclick="location.href='./'">‹</button></div><div class="portfolio-summary"><div class="metric"><span>שווי תיק כולל</span><b id="totalValue">₪0</b></div><div class="metric"><span>מספר אחזקות</span><b id="holdingCount">0</b></div></div><div class="price-status" id="priceStatus"><span id="priceStatusText">טוען מחירים עדכניים…</span><button id="refreshPrices">🔄 רענן מחירים</button></div><button class="primary2" id="newHolding">＋ הוסף אחזקה</button><section class="card form-card" id="form"><div class="sheet-head"><h2 id="formTitle">אחזקה חדשה</h2><button class="close" id="close">×</button></div><div class="field"><label>מטבע</label><select id="coin"></select></div><div class="form-grid"><div class="field"><label>כמות</label><input id="amount" type="number" min="0" step="any" placeholder="0.00"></div><div class="field"><label>תאריך רכישה, אופציונלי</label><input id="purchaseDate" type="date"></div></div><button class="primary2" id="saveHolding">שמור אחזקה</button><button class="secondary2" id="cancel">ביטול</button></section><div class="section-head"><h2>האחזקות שלי</h2></div><section id="holdings"></section><div class="notice">המחירים מגיעים מ-CoinGecko בזמן אמת ומעודכנים לפי בקשה. השווי המוצג הוא הערכה בלבד ואינו ייעוץ השקעות.</div></main><script>(()=>{'use strict';const $=x=>document.getElementById(x);const KEY='moneytalks-crypto-v1';const COINS=[{id:'bitcoin',symbol:'BTC',name:'ביטקוין',ico:'₿'},{id:'ethereum',symbol:'ETH',name:'את׳ריום',ico:'Ξ'},{id:'solana',symbol:'SOL',name:'סולאנה',ico:'◎'},{id:'ripple',symbol:'XRP',name:'ריפל (XRP)',ico:'✕'},{id:'binancecoin',symbol:'BNB',name:'בייננס קוין',ico:'B'},{id:'dogecoin',symbol:'DOGE',name:'דוג׳קוין',ico:'Ð'},{id:'cardano',symbol:'ADA',name:'קרדנו',ico:'₳'},{id:'tether',symbol:'USDT',name:'טת׳ר (USDT)',ico:'₮'}];const coinById=id=>COINS.find(c=>c.id===id)||{id,symbol:id,name:id,ico:'?'};let holdings=[],prices={},pricesAt=0,editId=null;function load(){try{holdings=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){holdings=[]}if(!Array.isArray(holdings))holdings=[];try{const cached=JSON.parse(localStorage.getItem(KEY+':prices')||'null');if(cached&&cached.prices){prices=cached.prices;pricesAt=cached.at||0}}catch(e){}}function persist(){localStorage.setItem(KEY,JSON.stringify(holdings))}function persistPrices(){localStorage.setItem(KEY+':prices',JSON.stringify({prices,at:pricesAt}))}function fmtILS(n){return new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',minimumFractionDigits:0,maximumFractionDigits:2}).format(Math.max(n||0,0))}function fmtAmount(n){return new Intl.NumberFormat('he-IL',{maximumFractionDigits:8}).format(n||0)}function populateCoinSelect(){$('coin').innerHTML=COINS.map(c=>`<option value="${c.id}">${c.name} (${c.symbol})</option>`).join('')}async function fetchPrices(){const status=$('priceStatus'),text=$('priceStatusText');status.classList.remove('stale');text.textContent='טוען מחירים עדכניים…';try{const ids=COINS.map(c=>c.id).join(',');const res=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=ils`);if(!res.ok)throw new Error('http '+res.status);const data=await res.json();const got={};let any=false;for(const c of COINS){if(data[c.id]&&typeof data[c.id].ils==='number'){got[c.id]=data[c.id].ils;any=true}}if(!any)throw new Error('no prices in response');prices=got;pricesAt=Date.now();persistPrices();text.textContent=`מחירים עודכנו ${new Date(pricesAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}`}catch(err){status.classList.add('stale');if(pricesAt){text.textContent=`⚠️ לא הצלחנו לטעון מחירים עדכניים כרגע (ייתכן ניתוק או הגבלת קצב ב-CoinGecko). מוצג מחיר אחרון מ-${new Date(pricesAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}.`}else{text.textContent='⚠️ לא הצלחנו לטעון מחירים כרגע (ייתכן ניתוק או הגבלת קצב ב-CoinGecko). אפשר לנסות שוב עם הכפתור.'}}render()}function openForm(h=null){editId=h?.id||null;$('formTitle').textContent=h?'עריכת אחזקה':'אחזקה חדשה';populateCoinSelect();$('coin').value=h?.coinId||COINS[0].id;$('amount').value=h?h.amount:'';$('purchaseDate').value=h?.purchaseDate||'';$('form').classList.add('show');$('form').scrollIntoView({behavior:'smooth',block:'start'})}function closeForm(){$('form').classList.remove('show');editId=null}function saveHolding(){const coinId=$('coin').value,amount=Number($('amount').value);if(!(amount>0))return alert('נא להזין כמות תקינה');const h={id:editId||'crypto-'+Date.now(),coinId,amount,purchaseDate:$('purchaseDate').value||''};const i=holdings.findIndex(x=>x.id===h.id);if(i>=0)holdings[i]=h;else holdings.push(h);persist();closeForm();render()}function removeHolding(id){if(!confirm('למחוק את האחזקה?'))return;holdings=holdings.filter(h=>h.id!==id);persist();render()}function render(){$('holdingCount').textContent=holdings.length;let total=0,anyMissing=false;for(const h of holdings){const p=prices[h.coinId];if(typeof p==='number')total+=h.amount*p;else anyMissing=true}$('totalValue').textContent=fmtILS(total)+(anyMissing&&holdings.length?' *':'');$('holdings').innerHTML=holdings.map(h=>{const c=coinById(h.coinId),p=prices[h.coinId],value=typeof p==='number'?h.amount*p:null;return`<div class="card holding-card"><div class="holding-top"><div class="ico">${c.ico}</div><div class="grow"><b>${c.name}</b><small>${c.symbol}${h.purchaseDate?' · נרכש '+h.purchaseDate:''}</small></div><b>${value!=null?fmtILS(value):'לא זמין'}</b></div><div class="holding-stats"><div class="holding-stat"><span>כמות</span><b>${fmtAmount(h.amount)}</b></div><div class="holding-stat"><span>מחיר יחידה</span><b>${typeof p==='number'?fmtILS(p):'לא זמין'}</b></div></div><div class="holding-actions"><button data-edit="${h.id}">עריכה</button><button class="del" data-del="${h.id}">מחיקה</button></div></div>`}).join('')||'<div class="empty">אין עדיין אחזקות. הוסף אחת כדי לראות שווי עדכני.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(holdings.find(h=>h.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeHolding(b.dataset.del))}$('newHolding').onclick=()=>openForm();$('close').onclick=closeForm;$('cancel').onclick=closeForm;$('saveHolding').onclick=saveHolding;$('refreshPrices').onclick=fetchPrices;load();populateCoinSelect();render();fetchPrices()})();</script></body></html>
