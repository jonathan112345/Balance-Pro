<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks | המנויים שלי</title><link rel="stylesheet" href="ui.css?v=20260825c"><style>.app{padding-bottom:50px}.back{border:0;background:#17263a;color:#19d3a7;width:40px;height:40px;border-radius:13px;font-size:20px}.sub-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#0d1929;border:1px solid #20314a;border-radius:18px;padding:14px}.metric span{font-size:10px;color:#91a0b6}.metric b{display:block;font-size:18px;margin-top:5px}.sub-card{margin-top:10px}.sub-top{display:flex;gap:10px;align-items:flex-start}.sub-top .grow{flex:1}.sub-top small{display:block;color:#91a0b6;margin-top:4px}.sub-hike{margin-top:11px;padding:10px 12px;border-radius:13px;background:#ff6b7a12;border:1px solid #ff6b7a45;color:#ff6b7a;font-size:11px;font-weight:800}.notice{margin-top:10px}</style></head><body><main class="app"><div class="topbar"><div><h1>המנויים שלי</h1><div class="eyebrow">זיהוי אוטומטי של חיובים חוזרים בתנועות שלך</div></div><button class="back" onclick="location.href='./'">‹</button></div><div class="sub-summary"><div class="metric"><span>סה״כ חודשי במנויים</span><b id="totalMonthly">₪0</b></div><div class="metric"><span>מנויים שזוהו</span><b id="subCount">0</b></div></div><div id="subs"></div><div class="notice">הזיהוי מבוסס על תנועות עם אותו שם עסק שחוזרות בערך כל 28-31 יום, בסכום דומה. ככל שיהיה יותר היסטוריית תנועות, הזיהוי יהיה מדויק יותר. אפשר תמיד לערוך או למחוק את התנועות המקוריות דרך מסך "ניהול נתונים".</div></main><script src="app-core.js?v=20260825c"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x);const st=MT.load();const fmt=m=>MT.fmt(st,m||0);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normName(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function detectSubscriptions(transactions){const groups={};for(const t of transactions){if(t.type!=='expense')continue;const key=normName(t.note||t.merchant||t.category||'');const date=t.occurredDate||t.date;if(!key||!date)continue;(groups[key]=groups[key]||[]).push({date,amountMinor:t.amountMinor||0,raw:t.note||t.merchant||t.category})}const subs=[];for(const key in groups){const list=groups[key].slice().sort((a,b)=>a.date.localeCompare(b.date));if(list.length<3)continue;const gaps=[];for(let i=1;i<list.length;i++){const days=Math.round((new Date(list[i].date)-new Date(list[i-1].date))/86400000);gaps.push(days)}const monthlyGaps=gaps.filter(g=>g>=27&&g<=32);if(monthlyGaps.length<2||monthlyGaps.length<gaps.length*0.6)continue;const priorAmounts=list.slice(0,-1).map(x=>x.amountMinor).sort((a,b)=>a-b);const priorMedian=priorAmounts[Math.floor(priorAmounts.length/2)];if(!priorMedian||!priorAmounts.every(a=>Math.abs(a-priorMedian)/priorMedian<=.15))continue;const last=list[list.length-1],prev=list[list.length-2];subs.push({name:last.raw,amountMinor:last.amountMinor,lastChargeDate:last.date,occurrences:list.length,priceIncreased:last.amountMinor>prev.amountMinor,prevAmountMinor:prev.amountMinor})}subs.sort((a,b)=>b.amountMinor-a.amountMinor);return subs}function render(){const subs=detectSubscriptions(st.transactions);$('subCount').textContent=subs.length;$('totalMonthly').textContent=fmt(subs.reduce((n,s)=>n+s.amountMinor,0));$('subs').innerHTML=subs.map(s=>`<div class="card sub-card"><div class="sub-top"><div class="grow"><b>${esc(s.name)}</b><small>חודשי · חויב לאחרונה ב-${s.lastChargeDate} · זוהה ב-${s.occurrences} תשלומים</small></div><b>${fmt(s.amountMinor)}</b></div>${s.priceIncreased?`<div class="sub-hike">⚠️ המחיר עלה מ-${fmt(s.prevAmountMinor)} ל-${fmt(s.amountMinor)}</div>`:''}</div>`).join('')||'<div class="card empty">לא זיהינו מנויים חוזרים עדיין. ככל שיצטברו יותר תנועות עם אותו שם עסק בערך כל חודש, הם יופיעו כאן אוטומטית.</div>'}render()})();</script></body></html>
