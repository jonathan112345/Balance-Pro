<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks | חיפוש</title><link rel="stylesheet" href="ui.css?v=20260822a"><style>.app{padding-bottom:40px}.searchbox{position:sticky;top:8px;z-index:5;background:#0d1929;border:1px solid #20314a;border-radius:18px;padding:12px 14px;display:flex;gap:8px;box-shadow:0 18px 45px #0003}.searchbox input{border:0;outline:0;background:transparent;width:100%;color:#fff;font-size:16px}.filters,.recent-searches{display:flex;gap:7px;overflow:auto;padding:10px 1px 2px}.filter,.history{white-space:nowrap;border:1px solid #20314a;background:#0d1929;border-radius:999px;padding:8px 11px;font-size:11px;color:#91a0b6}.filter.active{background:#19d3a7;color:#07111f;border-color:#19d3a7;font-weight:900}.result{cursor:pointer}.pill{font-size:9px;background:#19d3a714;color:#19d3a7;padding:4px 7px;border-radius:999px}.count{font-size:11px;color:#91a0b6;margin:12px 2px 2px}.back{border:0;background:#17263a;color:#19d3a7;width:40px;height:40px;border-radius:13px;font-size:20px}.clear{border:0;background:none;color:#91a0b6;font-size:18px}</style></head><body><main class="app"><div class="topbar"><div><h1>חיפוש</h1><div class="eyebrow">חיפוש אחד בכל MoneyTalks</div></div><button class="back" onclick="location.href='./'">‹</button></div><div class="searchbox"><span>🔎</span><input id="q" autofocus autocomplete="off" placeholder="בית עסק, קטגוריה, סכום, מסמך או הלוואה"><button class="clear" id="clear">×</button></div><div class="filters"><button class="filter active" data-type="all">הכל</button><button class="filter" data-type="transaction">תנועות</button><button class="filter" data-type="document">מסמכים</button><button class="filter" data-type="debt">הלוואות</button></div><div id="recentWrap"><div class="section-head"><h2>חיפושים אחרונים</h2></div><div class="recent-searches" id="recent"></div></div><div class="count" id="count"></div><div id="results"></div></main><script src="app-core.js?v=20260822a"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x),HKEY='moneytalks-search-history';let s=MT.load(),history=[];try{history=JSON.parse(localStorage.getItem(HKEY)||'[]')}catch(e){}let active='all';const money=n=>MT.fmt(s,n||0),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=x=>String(x??'').toLowerCase().trim(),matches=(q,v)=>norm(v.join(' ')).includes(q);function addHistory(q){q=q.trim();if(q.length<2)return;history=[q,...history.filter(x=>x!==q)].slice(0,6);localStorage.setItem(HKEY,JSON.stringify(history));renderHistory()}function renderHistory(){document.getElementById('recentWrap').style.display=history.length&&!$('q').value?'block':'none';$('recent').innerHTML=history.map((h,i)=>`<button class="history" data-h="${i}">🕘 ${esc(h)}</button>`).join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{$('q').value=history[+b.dataset.h];render()})}function result(label,icon,title,sub,right='',cls=''){return`<div class="card tx-row result"><span class="pill">${label}</span><div class="tx-icon">${icon}</div><div class="grow"><b>${title}</b><small>${sub}</small></div>${right?`<div class="amount ${cls}">${right}</div>`:''}</div>`}function render(){s=MT.load();let q=norm($('q').value),out=[];renderHistory();if(!q){$('count').textContent='';$('results').innerHTML='<div class="empty">תתחיל להקליד. אני אחפש בתנועות, מסמכים והלוואות.</div>';return}if(active==='all'||active==='transaction')(s.transactions||[]).forEach(t=>{let amount=MT.fromMinor(t.amountMinor||0),od=t.occurredDate||t.date||'',cd=t.cashflowDate||od;if(matches(q,[t.category,t.payment,t.note,t.merchant,od,cd,amount,t.type]))out.push(result('תנועה',t.type==='income'?'💰':t.type==='saving'?'🐷':'💳',esc(t.note||t.merchant||t.category||'תנועה'),`${esc(t.category||'')} · ${esc(od)}${cd!==od?' · חיוב '+esc(cd):''}`,`${t.type==='expense'?'-':t.type==='income'?'+':'↗'}${money(t.amountMinor)}`,t.type))});if(active==='all'||active==='document')(s.documents||[]).forEach(d=>{let minor=d.totalMinor||0;if(matches(q,[d.name,d.source,d.documentType,d.period]))out.push(result('מסמך','📄',esc(d.name||'מסמך'),`${esc(d.documentType||'')} · ${esc(d.source||'')} · ${esc(d.period||'')}`,minor?money(minor):''))});if(active==='all'||active==='debt')(s.debts||[]).forEach(d=>{let bal=d.balanceMinor??MT.toMinor(d.balance),pay=d.paymentMinor??MT.toMinor(d.payment);if(matches(q,[d.name,d.loanType,MT.fromMinor(bal),MT.fromMinor(pay),d.rate]))out.push(result('הלוואה','💳',esc(d.name||'הלוואה'),`${esc(d.loanType||'')} · החזר ${money(pay)} · ${d.rate||0}%`,money(bal))) });$('count').textContent=`${out.length} תוצאות`;$('results').innerHTML=out.join('')||'<div class="empty">לא מצאתי. נסה שם עסק, קטגוריה, סכום או תאריך.</div>'}let timer;$('q').addEventListener('input',()=>{clearTimeout(timer);render();timer=setTimeout(()=>addHistory($('q').value),900)});$('q').addEventListener('keydown',e=>{if(e.key==='Enter')addHistory($('q').value)});$('clear').onclick=()=>{$('q').value='';render();$('q').focus()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{active=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()});render()})();</script></body></html>
