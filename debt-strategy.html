<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks | מסלול סגירת חובות</title><link rel="stylesheet" href="ui.css?v=20260825d"><style>.app{padding-bottom:50px}.back{border:0;background:#17263a;color:#19d3a7;width:40px;height:40px;border-radius:13px;font-size:20px}.field label{display:block;color:#91a0b6;font-size:10px;margin:0 3px 6px}.field input{width:100%;border:1px solid #20314a;background:#091522;color:#fff;border-radius:13px;padding:12px;outline:0}.field small{display:block;color:#718096;font-size:9px;line-height:1.45;margin-top:5px}.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.strategy-grid{grid-template-columns:1fr}}.strategy-card{background:linear-gradient(145deg,#0d1929,#0a1522);border:1px solid #20314a;border-radius:20px;padding:16px}.strategy-card.winner{border-color:#19d3a7aa;box-shadow:0 0 0 1px #19d3a755}.strategy-card h3{font-size:14px;margin:0 0 3px}.strategy-card .eyebrow{margin-bottom:12px}.s-stat{background:#091522;border-radius:12px;padding:10px;margin-top:8px}.s-stat span{font-size:10px;color:#91a0b6;display:block}.s-stat b{font-size:16px;display:block;margin-top:3px}.s-order{margin-top:10px;font-size:11px;color:#c3cede;line-height:1.8}.s-order b{color:#19d3a7}.win-badge{display:inline-block;background:#19d3a7;color:#07111f;font-size:9px;font-weight:900;padding:3px 8px;border-radius:99px;margin-inline-start:6px}</style></head><body><main class="app"><div class="topbar"><div><h1>מסלול סגירת חובות</h1><div class="eyebrow">כדור שלג מול מפולת ריבית - איזה מסלול מתאים לך</div></div><button class="back" onclick="location.href='./loans.html'">‹</button></div><div id="content"></div></main><script src="app-core.js?v=20260825d"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x);const st=MT.load();const fmt=m=>MT.fmt(st,m||0);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pmt(balanceMinor,rate,months){let b=MT.fromMinor(balanceMinor),m=Number(months)||0,r=(Number(rate)||0)/1200;if(!b||!m)return 0;if(!r)return MT.toMinor(b/m);return MT.toMinor(b*r/(1-Math.pow(1+r,-m)))}function monthsToText(months){if(!Number.isFinite(months))return'לא ניתן לחשב';const y=Math.floor(months/12),m=months%12;if(y&&m)return`${y} שנים ו-${m} חודשים`;if(y)return`${y} שנים`;return`${m} חודשים`}function simulateStrategy(debts,sortFn,extraMinorBudget){const state=debts.map(d=>({name:d.name,balance:d.balanceMinor,rate:d.rate,minPaymentMinor:d.minPaymentMinor}));const order=state.slice().sort(sortFn);let months=0,totalInterestMinor=0;const maxMonths=1200;while(state.some(d=>d.balance>.5)&&months<maxMonths){months++;for(const d of state){if(d.balance<=0)continue;const r=(d.rate||0)/1200,interest=d.balance*r;totalInterestMinor+=interest;d.balance=Math.max(0,d.balance+interest-d.minPaymentMinor)}let pool=extraMinorBudget;for(const d of order)if(d.balance<=0)pool+=d.minPaymentMinor;for(const d of order){if(pool<=0)break;if(d.balance<=0)continue;const apply=Math.min(pool,d.balance);d.balance-=apply;pool-=apply}}return{months,totalInterestMinor:Math.round(totalInterestMinor),valid:months<maxMonths,order:order.map(d=>d.name)}}function render(){const debts=(st.debts||[]).filter(d=>(d.balanceMinor||0)>0);if(!debts.length){$('content').innerHTML='<div class="card empty">אין הלוואות פעילות כרגע. הוסף הלוואה במסך ההלוואות כדי לראות השוואת מסלולי סגירה.</div>';return}const prepared=debts.map(d=>({name:d.name,balanceMinor:d.balanceMinor,rate:d.rate,minPaymentMinor:(d.paymentMinor||pmt(d.balanceMinor,d.rate,d.months))+(d.extraMinor||0)}));const defaultExtra=debts.reduce((n,d)=>n+(d.extraMinor||0),0);$('content').innerHTML=`<section class="card"><b>תקציב נוסף חודשי לסגירת חובות</b><div class="eyebrow">מעבר להחזרים החודשיים הקיימים - כמה אפשר להוסיף כל חודש כדי לסגור הלוואות מהר יותר</div><div class="field"><label>תקציב נוסף</label><input id="extraBudget" type="number" min="0" step="10" value="${MT.fromMinor(defaultExtra)}"><small>ברירת המחדל היא סכום התוספות הקבועות שכבר הגדרת בהלוואות עצמן.</small></div></section><div class="strategy-grid" id="strategies"></div><div class="notice" style="margin-top:12px">כדור שלג: סוגר קודם את ההלוואה עם היתרה הקטנה ביותר - נותן ניצחונות מהירים ומוטיבציה. מפולת ריבית: סוגר קודם את ההלוואה עם הריבית הגבוהה ביותר - חוסך יותר כסף בטווח הארוך. שתי השיטות משתמשות באותו לוח סילוקין (שפיצר) שכבר קיים במסך ההלוואות.</div>`;renderStrategies(prepared)}function renderStrategies(prepared){const extraMinor=MT.toMinor(Number($('extraBudget').value)||0);const snowball=simulateStrategy(prepared,(a,b)=>a.balance-b.balance,extraMinor);const avalanche=simulateStrategy(prepared,(a,b)=>(b.rate||0)-(a.rate||0),extraMinor);const cheaper=avalanche.totalInterestMinor<=snowball.totalInterestMinor?'avalanche':'snowball';function card(title,sub,res,key){return`<div class="strategy-card ${key===cheaper?'winner':''}"><h3>${title}${key===cheaper?'<span class="win-badge">חוסך הכי הרבה ריבית</span>':''}</h3><div class="eyebrow">${sub}</div><div class="s-stat"><span>סה״כ ריבית עד סגירה מלאה</span><b>${res.valid?fmt(res.totalInterestMinor):'לא ניתן לחשב'}</b></div><div class="s-stat"><span>זמן משוער לסגירה מלאה</span><b>${res.valid?monthsToText(res.months):'לא ניתן לחשב'}</b></div><div class="s-order">סדר סגירה: ${res.order.map((n,i)=>`<b>${i+1}.</b> ${esc(n)}`).join(' · ')}</div></div>`}$('strategies').innerHTML=card('כדור שלג','הכי קטנה קודם',snowball,'snowball')+card('מפולת ריבית','הכי גבוהה ריבית קודם',avalanche,'avalanche');$('extraBudget').oninput=()=>renderStrategies(prepared)}render()})();</script></body></html>
