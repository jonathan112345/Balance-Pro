<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>MoneyTalks | דוח מע"מ</title><link rel="stylesheet" href="ui.css?v=20260826a"><style>.back{border:0;background:#17263a;color:#19d3a7;width:40px;height:40px;border-radius:13px;font-size:20px}.hidden{display:none!important}.range2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.period-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.period-btns button{flex:1;min-width:90px;border:1px solid var(--line);background:#101e30;color:var(--text);border-radius:12px;padding:9px;font-size:11px;font-weight:800}.period-btns button.active{border-color:var(--green);color:var(--green);background:#0f2a24}.vat-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.vat-row:last-child{border-bottom:0}.vat-row small{display:block;color:var(--muted);margin-top:3px}.vat-row .right{text-align:left}.net-owe{color:var(--red)}.net-refund{color:var(--green)}</style></head><body><main class="app"><div class="topbar"><div><h1>דוח מע"מ תקופתי</h1><div class="eyebrow">מע"מ שנגבה פחות מע"מ ששולם, לפי טווח תאריכים</div></div><button class="back" onclick="location.href='data.html'">‹</button></div><div id="notLicensed" class="card hidden"><div class="empty">דוח מע"מ רלוונטי רק לעוסק מורשה. אפשר לעדכן את הסטטוס העסקי במסך ניהול נתונים.</div></div><div id="reportArea"><div class="card"><div class="field"><label>טווח תאריכים</label><div class="range2"><input id="from" type="date"><input id="to" type="date"></div></div><div class="period-btns"><button type="button" data-period="month">החודש הנוכחי</button><button type="button" data-period="prevmonth">חודש קודם</button><button type="button" data-period="bimonth">דו-חודשי נוכחי</button></div></div><div class="grid3"><div class="stat"><span>מע"מ שנגבה</span><b id="vatCollected">₪0</b></div><div class="stat"><span>מע"מ ששולם</span><b id="vatPaid">₪0</b></div><div class="stat"><span>לתשלום / להחזר</span><b id="vatNet">₪0</b></div></div><div class="section-head"><h2>הכנסות עסקיות בטווח</h2></div><div class="card" id="incomeList"></div><div class="section-head"><h2>הוצאות עסקיות מוכרות בטווח</h2></div><div class="card" id="expenseList"></div></div></main><script src="app-core.js?v=20260826a"></script><script>(()=>{'use strict';const $=x=>document.getElementById(x);let st=MT.load();const fmt=n=>MT.fmt(st,n||0),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function vatOf(t){return t.vatMinor!=null?t.vatMinor:MT.vatSplit(t.amountMinor||0).vatMinor}function pad(n){return String(n).padStart(2,'0')}function monthRange(offset){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);let y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate();return[`${y}-${pad(m+1)}-01`,`${y}-${pad(m+1)}-${pad(last)}`]}function bimonthRange(){let d=new Date(),m=d.getMonth(),startM=m-(m%2),y=d.getFullYear(),endM=startM+1,last=new Date(y,endM+1,0).getDate();return[`${y}-${pad(startM+1)}-01`,`${y}-${pad(endM+1)}-${pad(last)}`]}function row(t){let d=t.occurredDate||t.date||'';return`<div class="vat-row"><div><b>${esc(t.note||t.category||'תנועה')}</b><small>${esc(d)}</small></div><div class="right"><b>${fmt(t.amountMinor)}</b><small>מע״מ: ${fmt(vatOf(t))}</small></div></div>`}function render(){let from=$('from').value,to=$('to').value;if(!from||!to)return;let inRange=t=>{let d=t.occurredDate||t.date||'';return d>=from&&d<=to};let incomeTx=st.transactions.filter(t=>t.type==='income'&&MT.isBiz(st,t)&&inRange(t));let expenseTx=st.transactions.filter(t=>t.type==='expense'&&MT.isBiz(st,t)&&t.deductible===true&&inRange(t));let collected=incomeTx.reduce((s,t)=>s+vatOf(t),0),paid=expenseTx.reduce((s,t)=>s+vatOf(t),0),net=collected-paid;$('vatCollected').textContent=fmt(collected);$('vatPaid').textContent=fmt(paid);$('vatNet').textContent=fmt(Math.abs(net))+(net>=0?' (לתשלום)':' (להחזר)');$('vatNet').className=net>=0?'net-owe':'net-refund';$('incomeList').innerHTML=incomeTx.length?incomeTx.map(row).join(''):'<div class="empty">אין הכנסות עסקיות בטווח זה.</div>';$('expenseList').innerHTML=expenseTx.length?expenseTx.map(row).join(''):'<div class="empty">אין הוצאות עסקיות מוכרות בטווח זה.</div>'}function setRange(range,btn){$('from').value=range[0];$('to').value=range[1];document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('active',b===btn));render()}if(st.businessStatus!=='licensed'){$('notLicensed').classList.remove('hidden');$('reportArea').classList.add('hidden')}else{document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>setRange(b.dataset.period==='month'?monthRange(0):b.dataset.period==='prevmonth'?monthRange(-1):bimonthRange(),b));$('from').onchange=render;$('to').onchange=render;setRange(monthRange(0),document.querySelector('[data-period="month"]'))}})();</script></body></html>
