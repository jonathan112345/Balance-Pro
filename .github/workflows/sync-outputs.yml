name: Sync outputs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test finance and document logic
        run: |
          node tests/money-core.test.js
          node tests/document-engine.test.js
          node tests/amex-fixtures.test.js

      - name: Copy current app files to outputs
        run: |
          mkdir -p outputs
          for file in index.html app.html app.js app-core.js ui.css home-plan.js home-plan.css document-engine.js documents.html documents-v8.html search.html data.html loans.html manifest.json sw.js icon.svg; do
            if [ -f "$file" ]; then cp "$file" "outputs/$file"; fi
          done

      - name: Commit outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "outputs already up to date"
          else
            git commit -m "Sync tested smart documents v8 to outputs"
            git push
          fi
